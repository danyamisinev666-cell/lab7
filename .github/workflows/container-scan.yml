name: Container Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ДОБАВЛЕН БЛОК ПРАВ:
permissions:
  contents: read          # нужно для actions/checkout
  security-events: write  # нужно для загрузки SARIF в Security tab
  actions: read           # иногда требуется для upload-sarif в приватных репозиториях

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --scanners vuln,secret,misconfig \
            app:${{ github.sha }}

      - name: Run Trivy config scanner
        run: |
          mkdir -p k8s
          trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/ Dockerfile

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
